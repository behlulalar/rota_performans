# Konteyner içi nginx: statik dosyalar + /api arka uca. TLS ve alan adı sunucudaki ana nginx'te.
# Panel alt alan adları: host'a göre panelin kendi manifest ve simgeleri sunulur (boşsa birleşik/veli varsayılanı).
map $host $rota_panel {
    ~^yonetim\. yonetim;
    ~^antrenor\. antrenor;
    ~^destek\. destek;
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 15m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # İstemci IP'si: ana nginx X-Forwarded-For'u TEK değerle (gerçek IP) yazar; aynen arka uca geçirilir.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Service worker ve giriş sayfası hiç önbelleğe alınmasın: yeni sürüm hemen görülsün.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # Panel dosyası varsa o, yoksa $uri (varsayılan veli dosyası). try_files son bağımsız değişkeni yeniden yönlendirir, o yüzden $uri kullanılır.
    location = /manifest.webmanifest {
        try_files /manifest-$rota_panel.webmanifest $uri =404;
        add_header Cache-Control "no-cache";
        types { }
        default_type application/manifest+json;
    }
    location = /apple-touch-icon.png {
        try_files /apple-touch-icon-$rota_panel.png $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /favicon.png {
        try_files /favicon-$rota_panel.png $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
