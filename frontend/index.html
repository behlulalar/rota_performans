<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0f" />
    <title>Rota Performans Akademi</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rota Performans" />
    <meta name="application-name" content="Rota Performans" />
    <meta name="msapplication-TileColor" content="#0d0d0e" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Render'dan önce tema seçilir; böylece yanıp sönme olmaz.
      // Varsayılan tema tüm girişlerde (veli, antrenör, yönetici) koyudur; cihaz teması izlenmez.
      // Kullanıcı temayı değiştirirse son seçimi bu cihazda kayıtlı kalır ve her açılışta uygulanır.
      (function () {
        var t = "dark";
        try {
          var k = localStorage.getItem("rota-tema-2");
          if (k === "light" || k === "dark") t = k;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        // Yazı boyutu: kayıtlı ölçek (CSS zoom) ilk boyamadan önce uygulanır.
        try {
          var yb = localStorage.getItem("rota-yazi-boyutu");
          var olc = { kucuk: 0.9, normal: 1, buyuk: 1.1, cokbuyuk: 1.25 }[yb];
          if (olc) {
            document.documentElement.dataset.yaziBoyutu = yb;
            document.documentElement.style.setProperty("--olcek", String(olc));
          }
        } catch (e) {}
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#fbfaf6" : "#0e0e0f");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
