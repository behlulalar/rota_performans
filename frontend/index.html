<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f10" />
    <title>Rota Performans Akademi</title>
    <script>
      // Render'dan önce tema seçilir; böylece yanıp sönme olmaz.
      (function () {
        var t = "dark";
        try {
          var k = localStorage.getItem("rota-tema");
          if (k === "light" || k === "dark") t = k;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
        } catch (e) {
          try {
            if (window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
          } catch (e2) {}
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Work+Sans:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
