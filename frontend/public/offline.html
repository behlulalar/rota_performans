<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0e" />
    <title>İnternet bağlantısı yok</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #0d0d0e; color: #f4f1e8; font-family: Outfit, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 360px; }
      img { width: 96px; height: auto; margin-bottom: 24px; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; color: #e0b52e; }
      p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #c9c5b8; }
      button { font: inherit; font-weight: 600; font-size: 14px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: #e0b52e; color: #0d0d0e; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Rota Performans Akademi" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Bağlantınızı kontrol edin ve tekrar deneyin. Bağlantı geri geldiğinde uygulama kaldığı yerden devam eder.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
