name: CI

# Her dal gönderiminde testler çalışır. `ozellik/*` dallarında testler geçerse son adım
# dalı main'e aktarır. main'e doğrudan gönderim de test edilir.
on:
  push:
    # arsiv/* dalları yalnızca geçmişi göstermek için tutulur, test ve birleştirme çalışmaz.
    branches: ["**", "!arsiv/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: rota_ci_sifre
          POSTGRES_DB: rota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rota -d rota_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://rota:rota_ci_sifre@localhost:5432/rota_test
      TEST_DATABASE_URL: postgresql+asyncpg://rota:rota_ci_sifre@localhost:5432/rota_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-icin-gecici-gizli-anahtar
      # Yalnızca CI için üretilmiş, hiçbir gerçek veriyi korumayan anahtarlar.
      KIMLIK_SIFRELEME_ANAHTARI: rU31a7PGqRiEJ_EaFsP3QLSadL_01VORfg67NFxZWh0=
      KIMLIK_OZET_ANAHTARI: JIo_qTVHzqIb7fx4qtBiStMzcUeeim7o86UEDeqM5QM=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Geçişler boş veritabanına uygulanabiliyor, geri alınabiliyor ve modelle uyumlu mu
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Tarayıcı uçtan uca testleri: boş veritabanı + sentetik veri, gerçek backend ve Vite sunucusu.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: rota_ci_sifre
          POSTGRES_DB: rota_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rota -d rota_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: e2e
      # Testlerin "bugün" hesabı backend ile aynı günü görsün (backend İstanbul saatini kullanır).
      TZ: Europe/Istanbul
      DATABASE_URL: postgresql+asyncpg://rota:rota_ci_sifre@localhost:5432/rota_e2e
      REDIS_URL: redis://localhost:6379/2
      JWT_SECRET: ci-icin-gecici-gizli-anahtar
      # Yalnızca CI için üretilmiş, hiçbir gerçek veriyi korumayan anahtarlar.
      KIMLIK_SIFRELEME_ANAHTARI: rU31a7PGqRiEJ_EaFsP3QLSadL_01VORfg67NFxZWh0=
      KIMLIK_OZET_ANAHTARI: JIo_qTVHzqIb7fx4qtBiStMzcUeeim7o86UEDeqM5QM=
      COOKIE_SECURE: "false"
      DOSYA_DIZINI: /tmp/e2e-uploads
      # Gerçek veri korumayan, yalnızca CI için sabit test hesabı.
      E2E_ADMIN_GIRIS: "+905559990001"
      E2E_ADMIN_SIFRE: ci-e2e-yonetici-sifresi-123
      E2E_BASE_URL: http://127.0.0.1:5175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend kurulumu
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Geçişler ve E2E tohum verisi
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.cli e2e-tohum
      - name: Backend'i başlat
        working-directory: backend
        run: nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Frontend kurulumu
        working-directory: frontend
        run: npm ci
      - name: Vite geliştirme sunucusunu başlat
        working-directory: frontend
        env:
          API_PROXY_TARGET: http://127.0.0.1:8000
        run: nohup npx vite --host 127.0.0.1 --port 5175 > "$RUNNER_TEMP/frontend.log" 2>&1 &
      - name: Servislerin hazır olmasını bekle
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/saglik >/dev/null && curl -fsS http://127.0.0.1:5175/api/saglik >/dev/null; then
              echo "Servisler hazır"; exit 0
            fi
            sleep 1
          done
          echo "::error::Servisler zamanında hazır olmadı"
          tail -n 50 "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log" || true
          exit 1
      - name: E2E bağımlılıkları ve tarayıcı
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright testleri
        working-directory: e2e
        run: npx playwright test
      - name: Playwright raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # GitHub'ın sağ kenarındaki "Deployments" bölümünü besler. Sunucu (VDS) hazır olunca
  # bu iş dalı staging ortamına kuracak; şimdilik testleri geçmiş sürümü kaydeder.
  onizleme:
    name: Preview
    needs: [backend, frontend, e2e]
    if: startsWith(github.ref, 'refs/heads/ozellik/')
    runs-on: ubuntu-latest
    environment:
      name: Preview
    steps:
      - name: Özet
        run: |
          {
            echo "### Preview: ${GITHUB_REF_NAME}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Backend testleri, frontend derlemesi ve E2E testleri geçti"
            echo "- Staging sunucusu henüz yok; kurulunca bu adım otomatik dağıtım yapacak"
          } >> "$GITHUB_STEP_SUMMARY"

  birlestir:
    name: Production (main'e aktar)
    needs: [onizleme]
    if: startsWith(github.ref, 'refs/heads/ozellik/')
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Yalnızca ileri sarma: main bu daldan sonra ilerlemişse birleştirme yapılmaz, böylece
      # test edilen commit ile main'e giren commit her zaman birebir aynıdır.
      - name: main'e ileri sar
        run: |
          git fetch origin main
          # Aynı anda gelen başka bir dal bu commit'i zaten main'e taşımış olabilir.
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "### Production: \`${GITHUB_SHA::7}\` zaten main'de" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main bu daldan sonra ilerlemiş. Dalı güncelleyip tekrar gönder: git rebase origin/main && git push --force-with-lease"
            exit 1
          fi
          git push origin HEAD:main
          echo "### Production: \`${GITHUB_SHA::7}\` main'e aktarıldı" >> "$GITHUB_STEP_SUMMARY"
