name: rota

# Geliştirme ortamı. Portlar yalnızca 127.0.0.1'e açılır ve makinedeki
# diğer servislerle çakışmaması için varsayılanlardan farklıdır.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rota
      POSTGRES_PASSWORD: rota_dev_sifre
      POSTGRES_DB: rota
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rota -d rota"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  dbdata:
  frontend_node_modules:
