# /etc/nginx/sites-available/rota.behlulalar.online (sites-enabled'a bağlanır)
# 1. ADIM: yalnız 80 (sertifika alınana kadar). certbot --webroot sonrası 2. blok eklenir (README).
server {
    listen 80;
    listen [::]:80;
    server_name rota.behlulalar.online;

    location /.well-known/acme-challenge/ {
        root /var/www/rota-acme;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. ADIM: sertifika alındıktan sonra bu blok etkinleştirilir.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rota.behlulalar.online;

    ssl_certificate     /etc/letsencrypt/live/rota.behlulalar.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rota.behlulalar.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:18500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Tek ve sahte olamayan değer: istemcinin gönderdiği X-Forwarded-For ezilir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
