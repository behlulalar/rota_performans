# /etc/nginx/sites-available/rotaperformans.com (sites-enabled'a bağlanır)
# Alan adları: veli. / yonetim. / antrenor. / destek. panel alt alan adları; çıplak ve www veli.'ye yönlenir.
# Sertifika (tek sertifika, tüm adlar; mevcut olanı genişletir):
#   certbot certonly --webroot -w /var/www/rota-acme --cert-name rotaperformans.com --expand -d rotaperformans.com -d www.rotaperformans.com -d veli.rotaperformans.com -d yonetim.rotaperformans.com -d antrenor.rotaperformans.com -d destek.rotaperformans.com
# İlk kurulumda sertifika yokken yalnız 80 bloklarını açın, 443 bloklarını yorum satırı yapın; sertifikadan sonra "nginx -t && systemctl reload nginx".
# Eski PWA temizleyicisi: deploy/canli/eski-sw.js dosyasını /etc/nginx/rota/eski-sw.js olarak kopyalayın.
# default_server uyarısı: kutuda başka default_server varsa çakışır; önce "grep -r default_server /etc/nginx/sites-enabled" bakın.

server {
    listen 80;
    listen [::]:80;
    server_name rotaperformans.com www.rotaperformans.com veli.rotaperformans.com yonetim.rotaperformans.com antrenor.rotaperformans.com destek.rotaperformans.com;

    location /.well-known/acme-challenge/ {
        root /var/www/rota-acme;
        allow all;
    }
    # Çıplak ve www: veli panele
    if ($host ~ ^(www\.)?rotaperformans\.com$) {
        return 301 https://veli.rotaperformans.com$request_uri;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Tanımsız Host: 80'de bağlantıyı kes, 443'te TLS el sıkışmasını reddet
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# Çıplak alan adı + www: eski PWA'yı temizleyen sw.js, geri kalan her şey veli paneline
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rotaperformans.com www.rotaperformans.com;

    ssl_certificate     /etc/letsencrypt/live/rotaperformans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rotaperformans.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /sw.js {
        alias /etc/nginx/rota/eski-sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        return 301 https://veli.rotaperformans.com$request_uri;
    }
}

# Panel alt alan adları: dördü de aynı uygulamaya; panelin hangisi olduğunu uygulama Host'tan çıkarır
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veli.rotaperformans.com yonetim.rotaperformans.com antrenor.rotaperformans.com destek.rotaperformans.com;

    ssl_certificate     /etc/letsencrypt/live/rotaperformans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rotaperformans.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Ön yüz sayfaları için de geçerli olsun diye burada; API'nin kendi eklediği kopyalar gizlenir (çift başlık olmasın).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cloudflare yok: istemci IP'si doğrudan $remote_addr'dır. İleride Cloudflare önüne alınırsa bu bloğa
    # "real_ip_header CF-Connecting-IP;" ve Cloudflare aralıkları için "set_real_ip_from ...;" satırları eklenir
    # (aralıklar: https://www.cloudflare.com/ips/; bkz. deploy/demo/nginx-rota.conf).

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:18500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Tek ve sahte olamayan değer: istemcinin gönderdiği X-Forwarded-For ezilir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
