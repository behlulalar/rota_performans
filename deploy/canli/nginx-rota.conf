# /etc/nginx/sites-available/rotaperformans.com (sites-enabled'a bağlanır)
# 1. ADIM: yalnız ilk (80) bloğu etkinleştirin; sertifika alınana kadar 443 bloklarını yorum satırı yapın.
#   certbot certonly --webroot -w /var/www/rota-acme -d rotaperformans.com -d www.rotaperformans.com
# 2. ADIM: sertifika alındıktan sonra 443 blokları açılır, "nginx -t && systemctl reload nginx".
server {
    listen 80;
    listen [::]:80;
    server_name rotaperformans.com www.rotaperformans.com;

    location /.well-known/acme-challenge/ {
        root /var/www/rota-acme;
        allow all;
    }
    location / {
        return 301 https://rotaperformans.com$request_uri;
    }
}

# www -> çıplak alan adı
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rotaperformans.com;

    ssl_certificate     /etc/letsencrypt/live/rotaperformans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rotaperformans.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://rotaperformans.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rotaperformans.com;

    ssl_certificate     /etc/letsencrypt/live/rotaperformans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rotaperformans.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Ön yüz sayfaları için de geçerli olsun diye burada; API'nin kendi eklediği kopyalar gizlenir (çift başlık olmasın).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cloudflare yok: istemci IP'si doğrudan $remote_addr'dır. İleride Cloudflare önüne alınırsa bu bloğa
    # "real_ip_header CF-Connecting-IP;" ve Cloudflare aralıkları için "set_real_ip_from ...;" satırları eklenir
    # (aralıklar: https://www.cloudflare.com/ips/; bkz. deploy/demo/nginx-rota.conf).

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:18500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Tek ve sahte olamayan değer: istemcinin gönderdiği X-Forwarded-For ezilir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
